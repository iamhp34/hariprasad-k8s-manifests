apiVersion: v1
kind: Service
metadata:
  name: hariprasad-app-svc
  namespace: default
  labels:
    app: hariprasad-app
spec:
  selector:
    app: hariprasad-app             # matches deployment label
  ports:
  - name: http
    protocol: TCP
    port: 80                        # service port (external)
    targetPort: 8080                # container port (internal)
  type: ClusterIP                   # internal only — ingress handles external
  # Use NodePort if you don't have ingress:
  # type: NodePort
  # nodePort: 30080
